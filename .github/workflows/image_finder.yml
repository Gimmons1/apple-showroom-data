name: Trova Immagini Automaticamente

on:
  push:
    paths:
      - 'apple_database.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find_images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install duckduckgo-search

      - name: Cerca nuove immagini
        run: python apple_image_finder.py

      - name: Salva modifiche nel database
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-Update: Aggiunte proposte immagini"
          file_pattern: "apple_database.json"
