name: Aggiorna Database AppleDB

on:
  schedule:
    - cron: '0 0 * * *' # Esegue ogni notte a mezzanotte
  workflow_dispatch: # Permette di avviarlo a mano con un tasto

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Installa Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Installa librerie
        run: pip install requests
      - name: Esegui Script Costruttore
        run: python apple_builder.py
      - name: Salva e Pusha il nuovo JSON
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add apple_database.json
          git commit -m "🤖 Aggiornamento automatico catalogo AppleDB" || echo "Nessuna modifica da salvare"
          git push
